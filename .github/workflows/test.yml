name: Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
        wp: [ '6.8' ]
    env:
      WP_VERSION: ${{ matrix.wp }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the test suite (docker compose)
        run: |
          docker compose build tooling
          docker compose run --rm tooling phpunit

  phpcs:
    name: PHPCS (WordPress-Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PHPCS (docker compose)
        run: |
          docker compose build tooling
          docker compose run --rm tooling phpcs

  build:
    name: Build submission zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: git archive (respects .gitattributes export-ignore)
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=zerokyc-pay/ -o dist/zerokyc-pay.zip HEAD
          unzip -l dist/zerokyc-pay.zip | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: zerokyc-pay
          path: dist/zerokyc-pay.zip
